name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 0 * * *'   # once a day, midnight UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate metrics SVG (stats + languages + streak)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_streaks: yes
          config_timezone: Asia/Kolkata
          config_output: svg
          config_display: large
          config_theme: dark
          # Neon-green-on-black look to match the profile theme
          config_base_color: '#000000'
          # See https://github.com/lowlighter/metrics for the full option list
