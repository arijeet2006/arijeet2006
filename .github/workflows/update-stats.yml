name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 0 * * *'   # once a day, midnight UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate metrics SVG (activity + repositories + languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.metrics }}
          filename: metrics.svg
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          config_timezone: Asia/Kolkata
          config_output: svg
          config_display: large
          # Black background + neon-green text/borders to match the profile theme
          extras_css: |
            :root { --color-canvas-default: #000000 !important; }
            body, .metrics { background-color: #000000 !important; }
            h1, h2, h3, text, tspan { fill: #39FF14 !important; color: #39FF14 !important; }
            .stats, .repo-card, .section { border-color: #39FF14 !important; }
