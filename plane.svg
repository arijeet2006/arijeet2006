<path d="M -80,115.19999999999999 C 180.0,56.0 360.0,136.0 540.0,64.0 S 810.0,88.0 980,48.0" fill="none" stroke="#39FF14" stroke-width="2.5" opacity="0.28"
  stroke-linecap="round" stroke-dasharray="6 10">
  <animate attributeName="stroke-dashoffset" values="0;-500" dur="5.5s" repeatCount="indefinite"/>
</path>
<path d="M -80,115.19999999999999 C 180.0,56.0 360.0,136.0 540.0,64.0 S 810.0,88.0 980,48.0" fill="none" stroke="#eafff0" stroke-width="1" opacity="0.18"
  stroke-linecap="round" stroke-dasharray="2 14">
  <animate attributeName="stroke-dashoffset" values="0;-500" dur="5.5s" repeatCount="indefinite"/>
</path>


  <g filter="url(#glow)">
    
<g id="jet">
  <!-- engine glow trail (behind jet) -->
  <ellipse cx="-70" cy="0" rx="46" ry="5" fill="#39FF14" opacity="0.35"/>
  <ellipse cx="-50" cy="0" rx="30" ry="4" fill="#eafff0" opacity="0.5"/>

  <!-- main fuselage -->
  <polygon points="60,0 20,-6 -55,-5 -70,0 -55,5 20,6" fill="#39FF14"/>
  <!-- nose cone -->
  <polygon points="60,0 42,-3 42,3" fill="#eafff0"/>
  <!-- cockpit -->
  <polygon points="18,-5 30,-3 30,3 18,5" fill="#0d3d0d"/>

  <!-- wings -->
  <polygon points="5,-4 -20,-32 -34,-30 -6,-3" fill="#1fbf0a"/>
  <polygon points="5,4 -20,32 -34,30 -6,3" fill="#1fbf0a"/>

  <!-- tail fins -->
  <polygon points="-40,-4 -60,-20 -66,-18 -50,-3" fill="#0d3d0d"/>
  <polygon points="-40,4 -60,20 -66,18 -50,3" fill="#0d3d0d"/>
  <polygon points="-52,-3 -70,-14 -74,-12 -58,0" fill="#39FF14" opacity="0.9"/>

  <!-- wingtip lights (blinking) -->
  <circle cx="-32" cy="-30" r="2.6" fill="#eafff0">
    <animate attributeName="opacity" values="1;0.15;1" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="-32" cy="30" r="2.6" fill="#7cffcb">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- engine flame flicker -->
  <polygon points="-70,-3 -92,0 -70,3" fill="#eafff0">
    <animate attributeName="points"
      values="-70,-3 -92,0 -70,3; -70,-4 -100,0 -70,4; -70,-3 -92,0 -70,3"
      dur="0.15s" repeatCount="indefinite"/>
  </polygon>
</g>

    <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto" path="M -80,115.19999999999999 C 180.0,56.0 360.0,136.0 540.0,64.0 S 810.0,88.0 980,48.0"/>
  </g>

  <!-- bottom accent line matching README dividers -->
  <rect x="0" y="157" width="900" height="3" fill="#0d3d0d"/>
</svg>
