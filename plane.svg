    <circle cx="715" cy="31" r="0.6" fill="#eafff0" opacity="0.5"/>
    <circle cx="537" cy="63" r="1" fill="#eafff0" opacity="0.7"/>
    <circle cx="294" cy="77" r="0.6" fill="#eafff0" opacity="0.2"/>
    <circle cx="524" cy="53" r="0.8" fill="#eafff0" opacity="0.5"/>
    <circle cx="155" cy="62" r="1.2" fill="#eafff0" opacity="0.2"/>
